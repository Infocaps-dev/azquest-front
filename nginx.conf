# Servidor do front publicado.
#
# Faz em producao o que o `vite.config.js` faz em desenvolvimento: serve a SPA
# e encaminha os quatro prefixos para os quatro servicos. O desenho e o mesmo de
# proposito, para o que funciona na maquina do desenvolvedor funcionar no ar.
#
# Por que proxy e nao CORS
# ------------------------
# O cookie de sessao que o BFF emite e `SameSite=Lax`. Lax nao viaja em
# requisicao cross-site, entao um front hospedado noutro dominio nao receberia
# o cookie nem com CORS liberado. Trocar para `SameSite=None` resolveria no
# Chrome e quebraria no Safari, que bloqueia cookie de terceiro por padrao, e
# ainda exigiria CORS em tres servicos (duas FastAPI hoje nao tem nenhum).
#
# Com o proxy, navegador e API ficam na mesma origem: o cookie e first-party,
# nao ha preflight, e nada muda nos tres servicos.

server {
    # 8080 porque a imagem base e a nginx-unprivileged, que roda sem root, e
    # porque e a porta que o Code Engine espera.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressao do que vale a pena. O bundle tem 554 KB de JS e 1,2 MB de CSS
    # do Carbon; comprimido cai para cerca de 280 KB no total.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Os arquivos com hash no nome podem ser guardados para sempre: um build
    # novo gera nomes novos. O index.html, nunca: e ele que aponta para os
    # nomes novos, e um index em cache serviria o bundle antigo depois de todo
    # deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---- Os quatro servicos -----------------------------------------------
    #
    # `proxy_ssl_server_name` e o `proxy_set_header Host` sao o equivalente do
    # `changeOrigin: true` do Vite: o Code Engine roteia pelo Host, e mandar o
    # host do front cairia fora da aplicacao de destino.

    # BFF de autenticacao. O prefixo NAO e removido: as rotas dele ja sao /api/*.
    location /api/ {
        proxy_pass https://azquest-auth-bff.2fom3olxz1yh.br-sao.codeengine.appdomain.cloud;
        proxy_set_header Host azquest-auth-bff.2fom3olxz1yh.br-sao.codeengine.appdomain.cloud;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto https;
    }

    # analise-api, etapa 1.2 e a conversa da tela de inicio. O prefixo sai.
    #
    # `proxy_buffering off` nao e detalhe: a rota /api/chat e um stream de
    # eventos, e com o buffer ligado o nginx segura tudo e entrega de uma vez
    # no fim. O chat pararia de transmitir sem dar erro nenhum.
    #
    # `proxy_read_timeout` alto porque o agente demora: gerar relatorio levou
    # 38s na medicao e uma pergunta de noticias, 58s. O padrao de 60s cortaria
    # a resposta no meio.
    location /analise/ {
        proxy_pass https://analise-api.2fom3olxz1yh.br-sao.codeengine.appdomain.cloud/;
        proxy_set_header Host analise-api.2fom3olxz1yh.br-sao.codeengine.appdomain.cloud;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # monitor-api, etapa 1.5. Tambem tem SSE, no andamento do ciclo B1 a B8.
    location /monitor/ {
        proxy_pass https://monitor-api.2fom3olxz1yh.br-sao.codeengine.appdomain.cloud/;
        proxy_set_header Host monitor-api.2fom3olxz1yh.br-sao.codeengine.appdomain.cloud;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # resumos-api: os relatórios gerados pelo agente, a revisão e a publicação
    # (aba Análise de Crédito e aba Desempenho). O prefixo sai. Sem SSE; o
    # timeout só precisa cobrir o HTML do relatório, que pode ter alguns MB.
    location /resumos/ {
        proxy_pass https://resumos-api.2g1a5bl5ugid.br-sao.codeengine.appdomain.cloud/;
        proxy_set_header Host resumos-api.2g1a5bl5ugid.br-sao.codeengine.appdomain.cloud;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    # coleta-api: o crawler de fontes publicas (aba Coleta). O prefixo sai.
    # Sem SSE: a tela pergunta o andamento a cada 2 s. O JSON do extrator
    # baixado por aqui pode ter alguns MB, dai o timeout maior.
    location /coleta/ {
        proxy_pass https://coleta-api.2fom3olxz1yh.br-sao.codeengine.appdomain.cloud/;
        proxy_set_header Host coleta-api.2fom3olxz1yh.br-sao.codeengine.appdomain.cloud;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    # ---- A SPA ------------------------------------------------------------
    #
    # Qualquer caminho que nao seja arquivo cai no index.html. Hoje a navegacao
    # e por estado, sem router, entao so a raiz e usada; a regra existe para o
    # dia em que houver link direto por aba, e para um F5 numa URL qualquer nao
    # virar 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
